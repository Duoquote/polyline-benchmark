<text x="16" y="629" font-size="11" fill="#666666">@mapbox/polyline, polyline-encoded and decode-google-map-polyline are CommonJS and google-polyline exports one object, so esbuild keeps the whole library for any import of them.</text>
<text x="16" y="644" font-size="11" fill="#666666">decode-google-map-polyline only decodes. ol is ol/format/Polyline's decodeDeltas and encodeDeltas. The whole entry also keeps the namespace object, so it's a bit more than both functions. Rollup and</text>
<text x="16" y="659" font-size="11" fill="#666666">webpack numbers are in docs/results.md.</text>

