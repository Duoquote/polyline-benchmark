# Correctness only. Timings from shared CI runners are too noisy to mean
# anything, so the benchmark itself is never run here.
#
# Every job checks every library (test/correctness.js), polytini included.
# polytini's own tests run in its repository, github.com/Duoquote/polytini.
name: correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: The report scripts run on the committed results
        run: node bench/best.js > /dev/null && node bench/charts.js && node bench/readme.js

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci --ignore-scripts
      - run: bun test/correctness.js

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --ignore-scripts
      - run: deno run --allow-read test/correctness.js
